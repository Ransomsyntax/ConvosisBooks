{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | CONVOSIS Books</title>
<link rel="icon" type="image/png" href="{% static 'books/img/convosis-logo.png' %}">
<script>try{var a=JSON.parse(localStorage.getItem('convosis_appearance_v1')||'null');var m=(a&&a.mode)||'light';if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',m)}catch(e){}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'books/css/glass.css' %}">
<link rel="stylesheet" href="{% static 'books/css/app.css' %}">
</head>
<body class="login">


<div id="wallpaper" class="wallpaper" aria-hidden="true"><div class="wp-image"></div><div class="wp-image"></div><div class="wp-dim"></div></div>


<div style="position:fixed; top:18px; right:20px; z-index:10; display:flex; gap:10px;">
  <button class="theme-toggle-btn" id="themeToggleBtn" type="button" onclick="ThemeEngine.toggleMode()" title="Toggle Dark / Light Theme">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <span>Theme</span>
  </button>
  <button class="icon-btn" type="button" title="Appearance & Wallpaper" onclick="ThemeEngine.toggleDrawer()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.2"/><circle cx="17.5" cy="10.5" r="1.2"/><circle cx="8.5" cy="7.5" r="1.2"/><circle cx="6.5" cy="12.5" r="1.2"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7H16c3.3 0 6-2.7 6-6 0-4.9-4.5-8.4-10-8.4z"/></svg>
  </button>
</div>

<!-- Floating Glass Login Card -->
<form method="post" class="lcard" novalidate>{% csrf_token %}
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
    <img src="{% static 'books/img/convosis-logo.png' %}" alt="Convosis" class="llogo" style="margin-bottom:0;">
    <span class="app" style="font-size:20px;">Books</span>
  </div>

  <h1>Sign in to Convosis Books</h1>
  <p class="sub" style="font-size:12.5px; margin:-10px 0 16px;">Enterprise Financial Operating System & GST Automation</p>

  <!-- Preloaded Demo Credentials Banner -->
  <div class="demo-credential-banner" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; margin-bottom:16px; border-radius:10px; background:var(--pastel-mint-bg); border:1px solid var(--pastel-mint-border); font-size:12px; color:var(--tx);">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:#10b981; box-shadow:0 0 8px #10b981;"></span>
      <span>Preloaded: <strong>admin</strong> / <strong>admin</strong></span>
    </div>
    <button type="button" id="fillDemoBtn" title="Refill demo credentials" style="background:var(--surface-glass); border:1px solid var(--bd-glass); border-radius:6px; padding:3px 9px; font-size:11px; font-weight:600; color:var(--pastel-mint-text); cursor:pointer; transition:all 0.15s ease;">
      Re-fill
    </button>
  </div>

  {% if form.errors %}
  <div class="lerr" role="alert">
    <strong>Authentication failed:</strong> Incorrect username or password.
  </div>
  {% endif %}

  <div class="fg">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <label for="id_username" style="margin-bottom:0;">Username</label>
      <span style="font-size:11px; color:var(--tx-muted);">Default: admin</span>
    </div>
    <input class="in" type="text" name="username" id="id_username" value="{% if form.is_bound %}{{ form.username.value|default:'' }}{% else %}admin{% endif %}" placeholder="Enter username…" autocomplete="username" required>
  </div>

  <div class="fg">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <label for="id_password" style="margin-bottom:0;">Password</label>
      <span style="font-size:11px; color:var(--tx-muted);">Default: admin</span>
    </div>
    <div style="position:relative; display:flex; align-items:center;">
      <input class="in" type="password" name="password" id="id_password" value="{% if not form.is_bound %}admin{% endif %}" placeholder="••••••••" autocomplete="current-password" required style="padding-right:38px; width:100%;">
      <button type="button" id="togglePasswordBtn" title="Show or hide password" aria-label="Toggle password visibility" style="position:absolute; right:10px; background:transparent; border:none; color:var(--tx-muted); cursor:pointer; padding:4px; display:flex; align-items:center; justify-content:center; border-radius:4px; transition:color 0.15s ease;">
        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
  </div>

  <input type="hidden" name="next" value="{{ next|default:'/' }}">

  <button class="btn p" id="submitLoginBtn" type="submit" autofocus style="width:100%; margin-top:14px; height:40px; font-size:14px; justify-content:center;">
    Sign in to Workspace
  </button>
</form>

<script src="{% static 'books/js/theme.js' %}"></script>
<script>
  (function() {
    const userInput = document.getElementById('id_username');
    const passInput = document.getElementById('id_password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const fillBtn = document.getElementById('fillDemoBtn');

    // Ensure preloading is applied if fields are empty
    if (userInput && !userInput.value) {
      userInput.value = 'admin';
    }
    if (passInput && !passInput.value) {
      passInput.value = 'admin';
    }

    // Toggle password reveal
    if (toggleBtn && passInput) {
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = passInput.type === 'password';
        passInput.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      });
    }

    // Quick re-fill button handler
    if (fillBtn && userInput && passInput) {
      fillBtn.addEventListener('click', function(e) {
        e.preventDefault();
        userInput.value = 'admin';
        passInput.value = 'admin';
        userInput.focus();
      });
    }
  })();
</script>
</body>
</html>
