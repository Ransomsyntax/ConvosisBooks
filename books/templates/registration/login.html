{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | CONVOSIS Books</title>
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'books/img/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'books/img/favicon-16x16.png' %}">
<link rel="icon" type="image/png" href="{% static 'books/img/favicon.png' %}">
<link rel="apple-touch-icon" href="{% static 'books/img/apple-touch-icon.png' %}">
<script>try{var a=JSON.parse(localStorage.getItem('convosis_appearance_v1')||'null');var m=(a&&a.mode)||'light';if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',m)}catch(e){}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'books/css/glass.css' %}">
<link rel="stylesheet" href="{% static 'books/css/app.css' %}">
</head>
<body class="login">


<div id="wallpaper" class="wallpaper" aria-hidden="true"><div class="wp-image"></div><div class="wp-image"></div><div class="wp-dim"></div></div>


<div style="position:fixed; top:18px; right:20px; z-index:10; display:flex; gap:10px;">
  <button class="theme-toggle-btn" id="themeToggleBtn" type="button" onclick="ThemeEngine.toggleMode()" title="Toggle Dark / Light Theme">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <span>Theme</span>
  </button>
  <button class="icon-btn" type="button" title="Appearance & Wallpaper" onclick="ThemeEngine.toggleDrawer()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.2"/><circle cx="17.5" cy="10.5" r="1.2"/><circle cx="8.5" cy="7.5" r="1.2"/><circle cx="6.5" cy="12.5" r="1.2"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7H16c3.3 0 6-2.7 6-6 0-4.9-4.5-8.4-10-8.4z"/></svg>
  </button>
</div>

<form method="post" class="lcard" novalidate>{% csrf_token %}
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
    <img src="{% static 'books/img/convosis-logo.png' %}" alt="Convosis" class="llogo" style="margin-bottom:0;">
    <span class="app" style="font-size:20px;">Books</span>
  </div>

  <h1>Sign in to Convosis Books</h1>
  <p class="sub" style="font-size:13px; margin:-8px 0 22px; color:var(--tx-muted);">Enterprise Financial Operating System &amp; GST Automation</p>

  {% if form.errors %}
  <div class="lerr" role="alert">
    <strong>Authentication failed:</strong> Incorrect username or password.
  </div>
  {% endif %}

  <div class="login-field-group">
    <label for="id_username" class="login-label">Username</label>
    <input class="login-input in" type="text" name="username" id="id_username" value="{% if form.is_bound %}{{ form.username.value|default:'' }}{% elif request.COOKIES.convosis_last_user %}{{ request.COOKIES.convosis_last_user }}{% endif %}" placeholder="Enter username…" autocomplete="username" required>
  </div>

  <div class="login-field-group">
    <label for="id_password" class="login-label">Password</label>
    <div class="login-password-wrapper">
      <input class="login-input in" type="password" name="password" id="id_password" value="{% if not form.is_bound and request.COOKIES.convosis_last_pass %}{{ request.COOKIES.convosis_last_pass }}{% endif %}" placeholder="••••••••" autocomplete="current-password" required>
      <button type="button" id="togglePasswordBtn" title="Show or hide password" aria-label="Toggle password visibility" class="login-password-toggle">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; margin-top:4px; margin-bottom:18px; font-size:12.5px;">
    <label style="display:inline-flex; align-items:center; gap:8px; color:var(--tx-muted); cursor:pointer; user-select:none;">
      <input type="checkbox" id="rememberMe" checked style="accent-color:var(--accent); width:15px; height:15px; cursor:pointer;">
      <span>Remember me</span>
    </label>
    <a href="javascript:void(0)" id="clearCredsLink" style="color:var(--tx-muted); text-decoration:none; font-size:11.5px; transition:color 0.15s ease;" onmouseover="this.style.color='var(--bad)'" onmouseout="this.style.color='var(--tx-muted)'">Clear saved</a>
  </div>

  <input type="hidden" name="next" value="{{ next|default:'/' }}">

  <button class="btn p login-btn-submit" id="submitLoginBtn" type="submit" autofocus>
    Sign in to Workspace
  </button>
</form>

<script src="{% static 'books/js/theme.js' %}"></script>
<script>
  (function() {
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
      return match ? decodeURIComponent(match[2]) : null;
    }
    function setCookie(name, val) {
      document.cookie = name + '=' + encodeURIComponent(val) + '; path=/; max-age=31536000; SameSite=Lax';
    }
    function delCookie(name) {
      document.cookie = name + '=; path=/; max-age=0; SameSite=Lax';
    }

    const STORAGE_KEY_USER = 'convosis_last_login_username';
    const STORAGE_KEY_PASS = 'convosis_last_login_password';
    const ACCOUNTS_KEY = 'convosis_saved_accounts_map';

    const userInput = document.getElementById('id_username');
    const passInput = document.getElementById('id_password');
    const badge = document.getElementById('preloadedUserBadge');
    const fillBtn = document.getElementById('fillDemoBtn');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const rememberMe = document.getElementById('rememberMe');
    const clearLink = document.getElementById('clearCredsLink');
    const form = document.querySelector('form.lcard');
    const submitBtn = document.getElementById('submitLoginBtn');

    function getStoredUser() {
      let u = null;
      try { u = localStorage.getItem(STORAGE_KEY_USER); } catch(e){}
      if (!u) u = getCookie('convosis_last_user');
      return u || '';
    }

    function getStoredPass() {
      let p = null;
      try { p = localStorage.getItem(STORAGE_KEY_PASS); } catch(e){}
      if (!p) p = getCookie('convosis_last_pass');
      return p || '';
    }

    function getStoredAccounts() {
      try {
        const raw = localStorage.getItem(ACCOUNTS_KEY);
        if (raw) return JSON.parse(raw) || {};
      } catch(e){}
      return { 'admin': 'admin' };
    }

    function refillPreviousLogin() {
      const u = getStoredUser() || 'admin';
      const accounts = getStoredAccounts();
      const p = getStoredPass() || accounts[u] || 'admin';

      if (userInput) userInput.value = u;
      if (passInput) passInput.value = p;
      if (badge) badge.textContent = u;
    }

    function persistCurrentCredentials() {
      if (!userInput || !passInput) return;
      const u = userInput.value.trim();
      const p = passInput.value;
      if (!rememberMe || rememberMe.checked) {
        if (u) {
          try { localStorage.setItem(STORAGE_KEY_USER, u); } catch(e){}
          setCookie('convosis_last_user', u);
          if (badge) badge.textContent = u;
        }
        if (p) {
          try { localStorage.setItem(STORAGE_KEY_PASS, p); } catch(e){}
          setCookie('convosis_last_pass', p);
        }
        if (u && p) {
          try {
            const accounts = getStoredAccounts();
            accounts[u] = p;
            localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
          } catch(e){}
        }
      }
    }

    {% if not form.is_bound %}
    refillPreviousLogin();
    {% else %}
    const remembered = getStoredUser();
    if (badge) badge.textContent = userInput && userInput.value ? userInput.value : (remembered || 'admin');
    {% endif %}

    if (userInput) {
      userInput.addEventListener('input', function() {
        const u = userInput.value.trim();
        if (badge) badge.textContent = u || 'admin';
        const accounts = getStoredAccounts();
        if (accounts[u] !== undefined && accounts[u]) {
          passInput.value = accounts[u];
        }
        persistCurrentCredentials();
      });
      userInput.addEventListener('change', persistCurrentCredentials);
    }

    if (passInput) {
      passInput.addEventListener('input', persistCurrentCredentials);
      passInput.addEventListener('change', persistCurrentCredentials);
    }

    if (fillBtn) {
      fillBtn.addEventListener('click', function(e) {
        e.preventDefault();
        refillPreviousLogin();
        if (userInput) userInput.focus();
      });
    }

    if (clearLink) {
      clearLink.addEventListener('click', function(e) {
        e.preventDefault();
        try {
          localStorage.removeItem(STORAGE_KEY_USER);
          localStorage.removeItem(STORAGE_KEY_PASS);
          localStorage.removeItem(ACCOUNTS_KEY);
        } catch(e){}
        delCookie('convosis_last_user');
        delCookie('convosis_last_pass');
        if (userInput) userInput.value = '';
        if (passInput) passInput.value = '';
        if (badge) badge.textContent = 'None';
      });
    }

    if (form) form.addEventListener('submit', persistCurrentCredentials);
    if (submitBtn) submitBtn.addEventListener('click', persistCurrentCredentials);
    window.addEventListener('beforeunload', persistCurrentCredentials);
    if (toggleBtn && passInput) {
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = passInput.type === 'password';
        passInput.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      });
    }
  })();
</script>
</body>
</html>
