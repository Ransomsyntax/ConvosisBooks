{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONVOSIS Books | Financial Operating System</title>
<link rel="icon" type="image/png" href="{% static 'books/img/convosis-logo.png' %}">
<script>try{var a=JSON.parse(localStorage.getItem('convosis_appearance_v1')||'null');var m=(a&&a.mode)||'light';if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',m)}catch(e){}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'books/css/glass.css' %}">
<link rel="stylesheet" href="{% static 'books/css/app.css' %}">
</head>
<body>

<div id="wallpaper" class="wallpaper" aria-hidden="true"><div class="wp-image"></div><div class="wp-image"></div><div class="wp-dim"></div></div>


<header id="top">
  <button class="ib" id="burger" type="button" aria-label="Toggle navigation" title="Toggle Sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  
  <a class="logo" href="#/home/dashboard">
    <img src="{% static 'books/img/convosis-logo.png' %}" alt="Convosis">
    <span class="app">Books</span>
  </a>

  <div id="gs">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="q" placeholder="Search customers, vendors, invoices, bills, items…" aria-label="Global search" autocomplete="off">
    <kbd>/</kbd>
    <div class="pop" id="qr" role="listbox"></div>
  </div>

  <div class="sp"></div>

  <button class="org" id="orgbtn" type="button" title="Organization Profile & Settings">
    <span id="orgname">Convosis Technologies</span>
    <small id="orgfy"></small>
  </button>

  <!-- <button class="theme-toggle-btn" id="ziaAssistantBtn" type="button" onclick="if(window.openFinGptDoubtBot) window.openFinGptDoubtBot(); else ziaAiAssistantModal();" title="Convosis FinGPT · ChatGPT for Financial & Compliance Doubts (Ctrl+K)" style="background:linear-gradient(135deg,rgba(16,163,127,0.22),rgba(99,102,241,0.22));border-color:rgba(16,185,129,0.45);color:var(--tx);">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
    <span>FinGPT Copilot</span>
  </button> -->

  <button class="theme-toggle-btn" id="themeToggleBtn" type="button" onclick="ThemeEngine.toggleMode()" title="Toggle Dark / Light Theme">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <span>Dark Mode</span>
  </button>

  <div class="rel">
    <button class="plus" id="qc" type="button" aria-label="Quick create" aria-haspopup="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span>Create</span>
    </button>
    <div class="pop right" id="qcm"></div>
  </div>

  <div class="rel">
    <button class="av" id="um" type="button" aria-label="User menu" aria-haspopup="true">A</button>
    <div class="pop right" id="umm">
      <div class="who" id="who"></div>
      <button class="mi" data-a="org" type="button">Organization Settings</button>
      <button class="mi" onclick="location.hash='#/accountant/security-compliance'" type="button">Security & Compliance</button>
      <button class="mi" onclick="ThemeEngine.openDrawer()" type="button">Appearance & Glass</button>
      <button class="mi" data-a="logout" type="button">Sign Out</button>
    </div>
  </div>
</header>

<nav id="side" aria-label="Main navigation"></nav>

<main><div class="pg" id="pg"></div></main>

<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="{% static 'books/js/theme.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{% static 'books/js/core.js' %}"></script>
<script src="{% static 'books/js/forms.js' %}"></script>
<script src="{% static 'books/js/dashboard.js' %}"></script>
<script src="{% static 'books/js/pages.js' %}"></script>
<script src="{% static 'books/js/app.js' %}"></script>
<script src="{% static 'books/js/chatbot.js' %}"></script>
</body>
</html>
