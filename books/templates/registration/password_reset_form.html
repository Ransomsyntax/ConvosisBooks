{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | CONVOSIS Books</title>
  <link rel="stylesheet" href="{% static 'books/css/glass.css' %}?v=2.2.0">
  <link rel="stylesheet" href="{% static 'books/css/app.css' %}?v=2.2.0">
</head>
<body class="login">
  <main class="lcard">
    <div class="login-brand-header"><img src="{% static 'books/img/convosis-logo.png' %}" alt="Convosis" class="llogo"><span class="app">Books</span></div>
    <div class="login-pane-header"><h1 class="login-pane-title">Reset your password</h1></div>
    <p>Enter your account email. If an account matches, we’ll email a password reset link.</p>
    <form method="post">
      {% csrf_token %}
      <div class="login-field-group">
        <label for="{{ form.email.id_for_label }}" class="login-label">Email address</label>
        <input class="login-input in" type="email" name="{{ form.email.html_name }}" id="{{ form.email.id_for_label }}" autocomplete="email" required maxlength="254">
        {% if form.email.errors %}<div class="lerr" role="alert">{{ form.email.errors }}</div>{% endif %}
      </div>
      <button class="btn p login-btn-submit" type="submit">Send reset link</button>
    </form>
    <p style="margin-top:16px;"><a href="{% url 'login' %}">Back to sign in</a></p>
  </main>
</body>
</html>
